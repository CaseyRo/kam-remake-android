; KaM Friendly Mod - UI theme (Direction A, warm storybook)
; Read by the engine at startup from "Modding graphics/theme.ini" (src/res/KM_ResTheme.pas).
; Colours are #RRGGBB or #RRGGBBAA (sRGB). Any key left out keeps the engine's own colour;
; deleting this file restores the stock look exactly.
;
; Palette: walnut-deep #4A2E18, ink #3A2A1C, linen-deep #E6D2A6, oak-light #C99A5E, honey #F0BE4E, cream #FFF6DF.

[Panels]
; The engine's black translucent panels (lists, memos, hints, Options groups) become walnut.
BevelColor=#4A2E18
BevelEdge=#3A2A1C
; Density the engine's default 0.5 panel gets; every other panel alpha follows the same curve (0 stays 0).
; 0.9 puts the Options groups (engine 0.4) at about 82%: cream labels 6.7:1 and disabled labels 3.5:1
; even over the lightest part of the parchment backdrop.
BevelAlpha=0.9
; 0 hides the wheat banner the main-menu Options page draws behind the language list (busy texture under text).
OptionsBanner=0
; Light edge of those panels (list borders, column headers, flat buttons), the column list grid and the results chart
; frame. The engine adds light to whatever is under the edge, which turns pure white over the cream card; oak at 50%
; sits in the palette instead.
ListLine=#C99A5E80

[Text]
; Tint for disabled captions, checkbox ticks and slider labels (multiplies the font's baked colour).
; A greyed linen, not a gold: about 3.7:1 on the walnut panels (WCAG exempts disabled controls) and
; 1.9:1 dimmer than the enabled cream, so it reads as "off" rather than as an accent.
TextDisabled=#C4BAA6
; Selected text in edit boxes and memos.
TextSelection=#F0BE4E55

[Selection]
; List rows: honey wash with a honey ring; a softer wash and an oak ring when the list is not focused.
ListSelection=#F0BE4E55
ListSelectionOutline=#F0BE4E
ListSelectionUnfocused=#F0BE4E33
ListSelectionOutlineUnfocused=#C99A5E
; Pressed / selected flat buttons (build menu and similar): 2 px honey ring instead of 1 px white.
SelectOutline=#F0BE4E
SelectOutlineWidth=2
; Hover wash on flat buttons.
Hover=#F0BE4E40

[Checkbox]
; Draw a tick (checkbox) and a dot (radio) instead of the font's "x".
CheckMark=tick
CheckColor=#F0BE4E
CheckboxOutline=#E6D2A6CC

[Buttons]
; Menu and game buttons (and scroll thumbs) drawn rounded: the button tile as the face on a lip of the same tile,
; darker. Radius and lip in UI units; the face sinks onto the lip when pressed. Hit areas are unchanged.
ButtonRadius=7
ButtonLip=3
; Ring on hover, just inside the face.
ButtonRing=#F0BE4E
; A disabled button: the face alone (no lip) at this opacity, caption in TextDisabled, so it reads as "off"
; instead of as pressed.
ButtonDisabledAlpha=0.5

[Locked]
; A house not yet available (build menu, statistics) shows its own icon multiplied by this colour and opacity,
; with the 'not available' badge (4_0041, the mod's "?" chip) small in its corner, instead of the badge alone.
LockedHouse=#9C8B788C

[Bars]
; Percent bars the engine draws in its stock green (house health): sage. The track is the walnut panel.
BarFill=#7A9A4A

[Results]
; Stat labels and values on the cream results card: any value switches them to the plain ink font (antiqua),
; whose glyphs are ink already (a tinted outlined font fills in its counters).
StatText=#3A2A1C

[Loading]
; "Loading... Please wait" tinted ink; the step lines in the plain ink font.
LoadingText=#3A2A1C

[PlayMore]
; GUI sprite ids for the "You won" / "You lost" prompt instead of the clock (4_0556): the laurel 4_0572 and
; the lowered banner 4_0573, in free GUI slots (an id with no sprite would show nothing).
PlayMoreWin=572
PlayMoreLose=573

[Menu]
; 0 hides the "Remake" caption under the logo on the main and single-player menus. Keep it until the logo sprite
; (5_0004) carries the word, or the game loses its name on those pages.
RemakeLabel=1
